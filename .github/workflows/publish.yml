# Publishes to PyPI when a release is published on GitHub (tag e.g. v5.0.0).
# One-time setup on pypi.org by the project owner: Project -> Settings -> Publishing ->
# add a "trusted publisher" for this GitHub repo and workflow (publish.yml), environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
